name: CI

# Runs on every PR, and is CALLED by the release workflow (publish-images.yml)
# as the gate before it tags a version and publishes images — so the suite that
# guards a PR is literally the same suite that guards a release, defined once.
#
# No `push: [main]` trigger: publish-images.yml runs on every push to main and
# invokes this via workflow_call, so a merge would otherwise run it twice.
on:
  pull_request:
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (includes typecheck)
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config -q
